[package]
name = "yxorp"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = { version = "0.13.5", features = ["mailbox_assert"] }
arc-swap = "1.7.1"
bytes = "1.11.1"
clap = { version = "4.5.53", features = ["derive"] }
httparse = "1.10.1"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.18", features = ["client-legacy", "http1", "http2", "server", "server-auto", "tokio"] }
instant-acme = "0.8.4"
io-uring = "0.6.4"
libc = "0.2.186"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.17.2"
memchr = "2.8.0"
rand = "0.9.2"
rcgen = "0.14.5"
rustls = { version = "0.23.22", features = ["ring", "aws_lc_rs"] }
rustls-pki-types = "1.10.1"
subtle = "2.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-uring = "0.5.0"
tokio-quiche = { version = "0.19.0", optional = true }
tokio-rustls = "0.26.4"
toml = "0.9.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
quiche = { version = "0.29.0", optional = true }
aya = "0.13.1"
futures-util = "0.3.31"

[features]
default = []
h3 = ["dep:quiche", "dep:tokio-quiche"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dev-dependencies]
tempfile = "3.23.0"
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "bench_yxorp"
harness = false

[[bench]]
name = "bench_pool"
harness = false

[[bench]]
name = "bench_body_forward"
harness = false
